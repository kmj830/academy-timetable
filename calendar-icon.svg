<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="topBanner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Calendar Page Interior -->
  <rect x="76" y="88" width="360" height="344" rx="36" fill="#ffffff" />

  <!-- Calendar Top Red/Blue Header -->
  <path d="M 76 124 C 76 104 92 88 112 88 L 400 88 C 420 88 436 104 436 124 L 436 170 L 76 170 Z" fill="url(#topBanner)" />

  <!-- Binder Rings -->
  <rect x="136" y="66" width="28" height="44" rx="14" fill="#0f172a" opacity="0.8" />
  <rect x="242" y="66" width="28" height="44" rx="14" fill="#0f172a" opacity="0.8" />
  <rect x="348" y="66" width="28" height="44" rx="14" fill="#0f172a" opacity="0.8" />

  <!-- Month Title on Header -->
  <text x="256" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ACADEMY</text>

  <!-- Timetable Grid & Cards inside -->
  <!-- Card 1: Sky Blue -->
  <rect x="108" y="196" width="138" height="60" rx="12" fill="#0284c7" opacity="0.9" />
  <rect x="114" y="202" width="6" height="48" rx="3" fill="#ffffff" opacity="0.7" />
  <circle cx="132" cy="226" r="6" fill="#ffffff" />
  <rect x="146" y="214" width="76" height="10" rx="4" fill="#ffffff" />
  <rect x="146" y="230" width="50" height="8" rx="3" fill="#ffffff" opacity="0.8" />

  <!-- Card 2: Emerald Green -->
  <rect x="266" y="196" width="138" height="60" rx="12" fill="#059669" opacity="0.9" />
  <rect x="272" y="202" width="6" height="48" rx="3" fill="#ffffff" opacity="0.7" />
  <circle cx="290" cy="226" r="6" fill="#ffffff" />
  <rect x="304" y="214" width="76" height="10" rx="4" fill="#ffffff" />
  <rect x="304" y="230" width="50" height="8" rx="3" fill="#ffffff" opacity="0.8" />

  <!-- Card 3: Orange Amber -->
  <rect x="108" y="272" width="138" height="60" rx="12" fill="#ea580c" opacity="0.9" />
  <rect x="114" y="278" width="6" height="48" rx="3" fill="#ffffff" opacity="0.7" />
  <circle cx="132" cy="302" r="6" fill="#ffffff" />
  <rect x="146" y="290" width="76" height="10" rx="4" fill="#ffffff" />
  <rect x="146" y="306" width="50" height="8" rx="3" fill="#ffffff" opacity="0.8" />

  <!-- Card 4: Violet Purple -->
  <rect x="266" y="272" width="138" height="60" rx="12" fill="#7c3aed" opacity="0.9" />
  <rect x="272" y="278" width="6" height="48" rx="3" fill="#ffffff" opacity="0.7" />
  <circle cx="290" cy="302" r="6" fill="#ffffff" />
  <rect x="304" y="290" width="76" height="10" rx="4" fill="#ffffff" />
  <rect x="304" y="306" width="50" height="8" rx="3" fill="#ffffff" opacity="0.8" />

  <!-- Card 5: Rose Pink Bottom Banner -->
  <rect x="108" y="348" width="296" height="52" rx="12" fill="#e11d48" opacity="0.85" />
  <circle cx="132" cy="374" r="8" fill="#ffffff" />
